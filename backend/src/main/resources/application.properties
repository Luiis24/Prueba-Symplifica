spring.application.name=backend
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5433/prueba_db
spring.datasource.username=prueba_user
spring.datasource.password=prueba_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Flyway - migrations live as Java classes under db.migration (see backend/src/main/java/db/migration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# Thymeleaf
spring.thymeleaf.cache=false

# Jackson
# Spring Boot 4 usa Jackson 3 (tools.jackson), donde WRITE_DATES_AS_TIMESTAMPS
# se movió de SerializationFeature a DateTimeFeature. Por eso la propiedad cambió
# de spring.jackson.serialization.* a spring.jackson.datatype.datetime.*
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Bogota
spring.jackson.locale=es_CO

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Logging
logging.level.root=INFO
logging.level.com.symplifica=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
